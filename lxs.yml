name: storage
domain: storage
version: 1.0.7
publisher: stuff8
status: unverified
license: mit
summary: "Photos & media: uploads, image/video processing, S3 storage, thumbnails"

targets:
  - linux/amd64

artifacts: {}

contract:
  version: 1
  api: "photos REST API (upload + serve + media metadata)"
  env:
    required:
      - SERVER_PORT
      - API_BASE_URL
      - S3_ENDPOINT
      - S3_REGION
      - S3_BUCKET
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
    optional:
      - CORS_ALLOWED_ORIGINS
      - MAX_IMAGE_MB
      - MAX_DOCUMENT_MB
      - MAX_IMAGE_PIXELS
      - MAX_VIDEO_MB
    defaults:
      S3_BUCKET: stuff8-storage
  db: "none"
  network:
    inbound: [http]
    outbound: [s3]
  resources:
    memory: "192m"
    disk: "1g"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies:
    - ffmpeg

provenance:
  source: ""
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
